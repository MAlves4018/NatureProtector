version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/webUI"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(webUI)"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(dotnet)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(actions)"
