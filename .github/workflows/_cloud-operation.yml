name: _cloud operation
run-name: Cloud operation ${{ inputs.operation_kind }} · ${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Control-plane operation identifier
        required: true
        type: string
      operation_kind:
        description: Closed cloud operation identifier
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string
      collect_evidence:
        description: Preserve dispatch receipt
        required: true
        default: "true"
        type: string
      ref:
        description: Source reference
        required: false
        default: master
        type: string
      ttlHours:
        description: Bounded staging TTL
        required: false
        default: "4"
        type: string
      planHash:
        description: Exact approved plan hash
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout callback reporter
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Dispatch current cloud authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.operation_kind }}
          TARGET_REF: ${{ inputs.ref }}
          TTL_HOURS: ${{ inputs.ttlHours }}
        run: |
          set -euo pipefail
          case "$KIND" in
            cloud-inventory)
              gh workflow run wif-readonly-probe.yml --ref "$TARGET_REF"
              workflow=wif-readonly-probe.yml
              ;;
            cloud-open-staging)
              [[ "$TTL_HOURS" =~ ^[0-9]+$ ]]
              gh workflow run open-staging.yml --ref "$TARGET_REF" -f ttl_hours="$TTL_HOURS"
              workflow=open-staging.yml
              ;;
            cloud-close-staging)
              gh workflow run teardown-staging.yml --ref "$TARGET_REF"
              workflow=teardown-staging.yml
              ;;
            *)
              echo "Cloud operation is intentionally blocked until a bounded authority exists: $KIND" >&2
              exit 3
              ;;
          esac
          printf '{"operationId":"%s","operationKind":"%s","workflow":"%s","status":"QUEUED","evidenceLevel":"IMPLEMENTED_NOT_PROVED"}\n' \
            '${{ inputs.operation_id }}' "$KIND" "$workflow" > dispatch-receipt.json

      - name: Preserve cloud dispatch receipt
        if: always() && inputs.collect_evidence == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-cloud-dispatch-${{ inputs.operation_id }}
          path: dispatch-receipt.json
          retention-days: 90
          if-no-files-found: warn

      - name: Report cloud dispatch state to operations API
        if: always()
        continue-on-error: true
        env:
          NP_OPERATIONS_CALLBACK_URL: ${{ vars.OPERATIONS_CALLBACK_URL }}
          NP_OPERATIONS_CALLBACK_SECRET: ${{ secrets.OPERATIONS_CALLBACK_SECRET }}
          RESULT_STATUS: ${{ job.status == 'success' && 'Queued' || 'Failed' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/operations/report-operation-callback.py
          --operation-id '${{ inputs.operation_id }}'
          --status "$RESULT_STATUS"
          --provider-reference "$RUN_URL"
          --detail 'Cloud wrapper dispatched the current bounded cloud authority.'
          --artifact-root dispatch-receipt.json
          --artifact-name cloud-dispatch-receipt
          --artifact-kind dispatch-receipt
          --artifact-reference "$RUN_URL"
          --receipt callback-receipt.json
