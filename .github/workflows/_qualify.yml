name: _qualify

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      manifest_path:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-toolchain
      - name: Download signed release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standard-cd-release
          path: g81-release
      - name: Verify staging release
        shell: pwsh
        run: ./scripts/np.ps1 staging verify -ManifestPath '${{ inputs.manifest_path }}'
      - name: Run G8.2 qualification integrity policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cloud/Test-G82Static.py
          python scripts/cloud/Test-G82Adversarial.py --repository-root .
