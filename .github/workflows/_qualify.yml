name: _qualify

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      manifest_path:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-toolchain
      - name: Verify staging release
        shell: pwsh
        run: ./scripts/np.ps1 staging verify -ManifestPath '${{ inputs.manifest_path }}'
      - name: Run G8.2 qualification integrity policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cloud/Test-G82Static.py
          python scripts/cloud/Test-G82Adversarial.py --repository-root .
