name: _evidence campaign operation
run-name: Evidence campaign ${{ inputs.operation_kind }} · ${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Control-plane operation identifier
        required: true
        type: string
      operation_kind:
        description: Closed evidence campaign identifier
        required: true
        type: string
      environment:
        description: Execution environment
        required: true
        default: ci
        type: string
      collect_evidence:
        description: Preserve campaign artifacts
        required: true
        default: "true"
        type: string
      ref:
        description: Source reference recorded by the control plane
        required: false
        default: master
        type: string
      profile:
        description: Closed evidence profile
        required: true
        type: string

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: webUI/package-lock.json

      - name: Resolve bounded campaign profile
        id: profile
        shell: bash
        env:
          KIND: ${{ inputs.operation_kind }}
        run: |
          set -euo pipefail
          case "$KIND" in
            evidence-static) profile=static; execute=true ;;
            evidence-quality) profile=quality; execute=true ;;
            evidence-full-plan) profile=full; execute=false ;;
            evidence-full-execute) profile=full; execute=true ;;
            *) echo "Unknown evidence campaign: $KIND" >&2; exit 2 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "execute=$execute" >> "$GITHUB_OUTPUT"

      - name: Execute authoritative evidence campaign
        shell: bash
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
          EXECUTE: ${{ steps.profile.outputs.execute }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          args=(--repo . --baseline-id "operations-$OPERATION_ID" --run-id "$OPERATION_ID" --profile "$PROFILE")
          if [[ "$EXECUTE" == true ]]; then
            args+=(--execute --continue-on-error)
          fi
          if [[ '${{ inputs.operation_kind }}' == evidence-full-execute ]]; then
            args+=(--acknowledge-non-production)
          fi
          python scripts/evidence/run-report-evidence-campaign.py "${args[@]}"

      - name: Preserve evidence campaign
        if: always() && inputs.collect_evidence == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-evidence-${{ inputs.operation_id }}
          path: artifacts/report-evidence/operations-${{ inputs.operation_id }}/
          retention-days: 90
          if-no-files-found: error

      - name: Report evidence campaign result to operations API
        if: always()
        continue-on-error: true
        env:
          NP_OPERATIONS_CALLBACK_URL: ${{ vars.OPERATIONS_CALLBACK_URL }}
          NP_OPERATIONS_CALLBACK_SECRET: ${{ secrets.OPERATIONS_CALLBACK_SECRET }}
          RESULT_STATUS: ${{ job.status == 'success' && 'Succeeded' || 'Failed' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/operations/report-operation-callback.py
          --operation-id '${{ inputs.operation_id }}'
          --status "$RESULT_STATUS"
          --provider-reference "$RUN_URL"
          --detail 'Canonical report evidence campaign completed.'
          --artifact-root 'artifacts/report-evidence/operations-${{ inputs.operation_id }}'
          --artifact-name report-evidence-campaign
          --artifact-kind evidence-package
          --artifact-reference "$RUN_URL"
          --receipt callback-receipt.json

      - name: Preserve callback receipt
        if: always() && inputs.collect_evidence == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-evidence-callback-${{ inputs.operation_id }}
          path: callback-receipt.json
          retention-days: 90
          if-no-files-found: warn
