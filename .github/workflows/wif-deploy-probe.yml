name: WIF deploy authority probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-authority-probe:
    name: WIF deploy authority probe
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Guard required configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${{ vars.WIF_PROVIDER }}"
          test -n "${{ vars.DEPLOY_SERVICE_ACCOUNT }}"
          test -n "${{ vars.GCP_PROJECT_ID }}"
          test "${{ vars.STAGING_SESSION_OPEN }}" = "false"

          echo "STAGING_SESSION_CLOSED"

      - name: Authenticate deploy authority through GitHub OIDC and WIF
        uses: ./.github/actions/cloud-auth
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Prove temporary deploy credentials
        shell: bash
        run: |
          set -euo pipefail

          active_account="$(
            gcloud auth list \
              --filter='status:ACTIVE' \
              --format='value(account)'
          )"

          test "$active_account" = "${{ vars.DEPLOY_SERVICE_ACCOUNT }}"

          gcloud auth print-access-token >/dev/null

          echo "DEPLOY_WIF_EXECUTION_PROVED"
          echo "DEPLOY_PROJECT_ROLES_ZERO"
          echo "STAGING_SESSION_CLOSED"

  state-backend-probe:
    name: State backend WIF probe
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Authenticate deploy identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Prove federated identity
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_ACCOUNT="$(
            gcloud auth list \
              --filter='status:ACTIVE' \
              --format='value(account)'
          )"

          echo "ACTIVE_ACCOUNT=${ACTIVE_ACCOUNT}"

          test "${ACTIVE_ACCOUNT}" = "${DEPLOY_SERVICE_ACCOUNT}"

          echo "DEPLOY_WIF_EXECUTION_PROVED"

      - name: Prove canonical state read access
        shell: bash
        run: |
          set -euo pipefail

          gcloud storage cat \
            "gs://${STATE_BUCKET}/state-bootstrap/g8-1/default.tfstate" \
            >/dev/null

          echo "STATE_BACKEND_WIF_READ_PROVED"
      - name: Prove retention-safe bucket contract
        shell: bash
        run: |
          set -euo pipefail

          BUCKET_JSON="$(
            gcloud storage buckets describe \
              "gs://${STATE_BUCKET}" \
              --format=json
          )"

          python3 - "${BUCKET_JSON}" <<'PY'
          import json
          import sys

          bucket = json.loads(sys.argv[1])

          assert bucket["name"] == "np-tfstate-migkxl-202606"
          assert bucket["location"] == "EUROPE-SOUTHWEST1"
          assert bucket["uniform_bucket_level_access"] is True
          assert bucket["public_access_prevention"] == "enforced"
          assert bucket["versioning_enabled"] is True
          assert bucket["retention_policy"]["retentionPeriod"] == "2592000"

          print("STATE_BACKEND_RETENTION_PROVED")
          print("STATE_BACKEND_VERSIONING_PROVED")
          print("STATE_BACKEND_PUBLIC_ACCESS_PREVENTION_PROVED")
          PY

          echo "STATE_BACKEND_MUTATION_PROBE_DISABLED"
          echo "STATE_BACKEND_CANONICAL_PREFIX_READ_ONLY"
