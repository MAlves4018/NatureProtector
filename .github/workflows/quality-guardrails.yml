name: Quality guardrails

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: "Guardrail mode"
        required: true
        default: report
        type: choice
        options:
          - report
          - enforce

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Enforced quality guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUALITY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'enforce' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: webUI/package-lock.json

      - name: Install frontend dependencies
        working-directory: webUI
        run: npm ci

      - name: Install Python quality tools
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/quality-gates/requirements.txt

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Install ShellCheck from signed Ubuntu repositories
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck --version

      - name: Restore .NET dependencies
        run: dotnet restore NatureProtector.sln --configfile NuGet.Config --nologo

      - name: Run evidence tooling regression tests
        run: python -m unittest discover -s tests/evidence -p "test_*.py" -v

      - name: Run progressive guardrails
        run: >-
          python tools/quality-gates/run.py
          --repo .
          --mode "$QUALITY_MODE"
          --output-dir artifacts/quality

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-guardrails-${{ env.QUALITY_MODE }}
          retention-days: 14
          path: artifacts/quality/
