name: _release

on:
  workflow_call:
    outputs:
      manifest_path:
        value: ${{ jobs.release.outputs.manifest_path }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      manifest_path: ${{ steps.manifest.outputs.path }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/cloud-auth
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.RELEASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: ">= 552.0.0"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Configure Artifact Registry and Buildx
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker buildx create --name natureprotector-standard-cd --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build signed release
        shell: pwsh
        env:
          GCP_PLATFORM_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
          ENGINEERING_RUN_ID: ${{ github.run_id }}
          SECURITY_RUN_ID: ${{ github.run_id }}
          POLICY_RUN_ID: ${{ github.run_id }}
          COSIGN_CERTIFICATE_IDENTITY: "${{ github.server_url }}/${{ github.workflow_ref }}"
        run: ./scripts/np.ps1 release build
      - name: Verify release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f g81-release/release-manifest.json
          echo "path=g81-release/release-manifest.json" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/resolve-release
        with:
          manifest_path: g81-release/release-manifest.json
      - uses: ./.github/actions/collect-evidence
        with:
          evidence_path: g81-release
          artifact_name: standard-cd-release
