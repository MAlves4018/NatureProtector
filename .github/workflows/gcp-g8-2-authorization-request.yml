name: G8.2 authorization request

on:
  workflow_dispatch:
    inputs:
      candidate_commit: {description: Exact candidate commit, required: true, type: string}
      qualification_run_id: {description: Successful G8.2 finalization run, required: true, type: string}
      review_verification_run_id: {description: Accepted independent review verification run, required: true, type: string}
      validity_hours: {description: Requested authorization validity, required: true, default: '24', type: string}
      confirmation: {description: CREATE_G82_AUTHORIZATION_REQUEST, required: true, type: string}

permissions: {contents: read, actions: read, attestations: write}

jobs:
  request:
    if: inputs.confirmation == 'CREATE_G82_AUTHORIZATION_REQUEST'
    environment: production-authorization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {ref: '${{ inputs.candidate_commit }}'}
      - shell: bash
        run: python -m pip install -r scripts/cloud/requirements-g82.txt
      - name: Validate and bind qualification and review
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p '${{ runner.temp }}/qualification' '${{ runner.temp }}/review' '${{ runner.temp }}/request'
          scripts/cloud/Verify-G82WorkflowRun.sh '${{ inputs.qualification_run_id }}' '.github/workflows/gcp-g8-2-runtime-qualification.yml' '${{ inputs.candidate_commit }}' '${{ github.event.repository.default_branch }}' '${{ github.repository }}' '${{ runner.temp }}/qualification/run.json'
          scripts/cloud/Verify-G82WorkflowRun.sh '${{ inputs.review_verification_run_id }}' '.github/workflows/gcp-g8-2-independent-review.yml' '${{ inputs.candidate_commit }}' '${{ github.event.repository.default_branch }}' '${{ github.repository }}' '${{ runner.temp }}/review/run.json'
          gh run download '${{ inputs.qualification_run_id }}' --repo '${{ github.repository }}' --name g82-final-qualification --dir '${{ runner.temp }}/qualification/artifact'
          gh run download '${{ inputs.review_verification_run_id }}' --repo '${{ github.repository }}' --name g82-independent-review-verdict --dir '${{ runner.temp }}/review/artifact'
          gh attestation verify '${{ runner.temp }}/qualification/artifact/g82-review-packet.zip' --repo '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/gcp-g8-2-runtime-qualification.yml' --source-digest '${{ inputs.candidate_commit }}' --source-ref 'refs/heads/${{ github.event.repository.default_branch }}'
          unzip -q '${{ runner.temp }}/qualification/artifact/g82-review-packet.zip' -d '${{ runner.temp }}/qualification/packet'
          python scripts/cloud/New-G82AuthorizationRequest.py --final-verdict '${{ runner.temp }}/qualification/packet/final-verdict.json' --evidence-index '${{ runner.temp }}/qualification/packet/evidence-index.json' --archive-receipt '${{ runner.temp }}/qualification/packet/archive-receipt.json' --independent-review '${{ runner.temp }}/review/artifact/independent-review.json' --independent-review-verdict '${{ runner.temp }}/review/artifact/independent-review-verdict.json' --candidate-manifest '${{ runner.temp }}/qualification/packet/candidate-manifest.json' --validity-hours '${{ inputs.validity_hours }}' --output '${{ runner.temp }}/request/authorization-request.json'
          sha256sum '${{ runner.temp }}/request/authorization-request.json' > '${{ runner.temp }}/request/authorization-request.json.sha256'
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with: {subject-path: '${{ runner.temp }}/request/authorization-request.json'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g82-authorization-request
          path: ${{ runner.temp }}/request
          retention-days: 365
          if-no-files-found: error
