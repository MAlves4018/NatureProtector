name: G8.2 independent review verification

on:
  workflow_dispatch:
    inputs:
      candidate_commit: {description: Exact candidate commit, required: true, type: string}
      qualification_run_id: {description: Successful G8.2 finalization run, required: true, type: string}
      review_submission_run_id: {description: Signed independent review submission run, required: true, type: string}
      confirmation: {description: VERIFY_G82_INDEPENDENT_REVIEW, required: true, type: string}

permissions:
  contents: read
  actions: read
  attestations: write

jobs:
  verify:
    if: inputs.confirmation == 'VERIFY_G82_INDEPENDENT_REVIEW'
    environment: independent-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {ref: '${{ inputs.candidate_commit }}'}
      - name: Install validator dependency
        shell: bash
        run: python -m pip install -r scripts/cloud/requirements-g82.txt
      - name: Validate source workflow runs and download artifacts
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p '${{ runner.temp }}/qualification' '${{ runner.temp }}/review'
          scripts/cloud/Verify-G82WorkflowRun.sh '${{ inputs.qualification_run_id }}' '.github/workflows/gcp-g8-2-runtime-qualification.yml' '${{ inputs.candidate_commit }}' '${{ github.event.repository.default_branch }}' '${{ github.repository }}' '${{ runner.temp }}/qualification/run.json'
          scripts/cloud/Verify-G82WorkflowRun.sh '${{ inputs.review_submission_run_id }}' '.github/workflows/gcp-g8-2-submit-signed-governance.yml' '${{ inputs.candidate_commit }}' '${{ github.event.repository.default_branch }}' '${{ github.repository }}' '${{ runner.temp }}/review/run.json'
          gh run download '${{ inputs.qualification_run_id }}' --repo '${{ github.repository }}' --name g82-final-qualification --dir '${{ runner.temp }}/qualification/artifact'
          gh run download '${{ inputs.review_submission_run_id }}' --repo '${{ github.repository }}' --name g82-independent-review-submission --dir '${{ runner.temp }}/review/artifact'
          qual_zip='${{ runner.temp }}/qualification/artifact/g82-review-packet.zip'
          review_zip='${{ runner.temp }}/review/artifact/g82-signed-governance.zip'
          gh attestation verify "$qual_zip" --repo '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/gcp-g8-2-runtime-qualification.yml' --source-digest '${{ inputs.candidate_commit }}' --source-ref 'refs/heads/${{ github.event.repository.default_branch }}'
          gh attestation verify "$review_zip" --repo '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/gcp-g8-2-submit-signed-governance.yml' --source-digest '${{ inputs.candidate_commit }}' --source-ref 'refs/heads/${{ github.event.repository.default_branch }}'
          unzip -q "$qual_zip" -d '${{ runner.temp }}/qualification/packet'
          unzip -q "$review_zip" -d '${{ runner.temp }}/review/submission'
          [[ "$(cat '${{ runner.temp }}/review/submission/document-type.txt')" == independent-review ]]
          printf '%s' '${{ vars.G82_REVIEW_ALLOWED_SIGNERS_B64 }}' | base64 -d > '${{ runner.temp }}/review/allowed_signers'
          python scripts/cloud/Test-G82IndependentReview.py --review '${{ runner.temp }}/review/submission/document.json' --signature '${{ runner.temp }}/review/submission/document.json.sig' --allowed-signers '${{ runner.temp }}/review/allowed_signers' --final-verdict '${{ runner.temp }}/qualification/packet/final-verdict.json' --evidence-index '${{ runner.temp }}/qualification/packet/evidence-index.json' --candidate-manifest '${{ runner.temp }}/qualification/packet/candidate-manifest.json' --archive-receipt '${{ runner.temp }}/qualification/packet/archive-receipt.json' --output '${{ runner.temp }}/review/independent-review-verdict.json'
          cp '${{ runner.temp }}/review/submission/document.json' '${{ runner.temp }}/review/independent-review.json'
          sha256sum '${{ runner.temp }}/review/independent-review.json' '${{ runner.temp }}/review/independent-review-verdict.json' > '${{ runner.temp }}/review/checksums.sha256'
      - name: Attest review verdict
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: |
            ${{ runner.temp }}/review/independent-review.json
            ${{ runner.temp }}/review/independent-review-verdict.json
      - name: Upload independent review verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g82-independent-review-verdict
          path: |
            ${{ runner.temp }}/review/independent-review.json
            ${{ runner.temp }}/review/independent-review-verdict.json
            ${{ runner.temp }}/review/checksums.sha256
          retention-days: 365
          if-no-files-found: error
