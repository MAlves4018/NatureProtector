services:
  postgres:
    image: postgres:16
    container_name: np-postgres-it
    environment:
      POSTGRES_DB: natureprotector
      POSTGRES_USER: np
      POSTGRES_PASSWORD: np_dev_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U np -d natureprotector"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.0.6-management
    container_name: np-rabbitmq-it
    environment:
      RABBITMQ_DEFAULT_USER: np
      RABBITMQ_DEFAULT_PASS: np_dev_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  influxdb:
    image: influxdb:3.7.0-core
    container_name: np-influxdb-it
    command:
      - influxdb3
      - serve
      - --node-id
      - node1
      - --object-store
      - memory
      - --without-auth
    ports:
      - "8181:8181"
