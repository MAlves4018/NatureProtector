apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: natureprotector-frontend
manifests:
  rawYaml:
    - service.yaml
deploy:
  cloudrun: {}
verify:
  - name: natureprotector-frontend-health
    container:
      name: smoke
      image: SMOKE_IMAGE_BY_DIGEST
      command: ["/bin/sh", "-c"]
      args: ["test -n '$CLOUD_RUN_SERVICE_URLS' && url=\"${CLOUD_RUN_SERVICE_URLS%%,*}\" && curl -fsS \"$url/healthz\" >/dev/null"]
profiles:
  - name: staging
  - name: production
