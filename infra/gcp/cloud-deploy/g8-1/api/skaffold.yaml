apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: natureprotector-api
manifests:
  rawYaml:
    - service.yaml
deploy:
  cloudrun: {}
verify:
  - name: natureprotector-api-health
    container:
      name: smoke
      image: SMOKE_IMAGE_BY_DIGEST
      command: ["/bin/sh", "-c"]
      args: ['test -n "$CLOUD_RUN_SERVICE_URLS" && case "$CLOUD_RUN_SERVICE_URLS" in *run.app*) echo "Cloud Run API rollout produced run.app metadata; HTTP /health/live is verified through the protected edge smoke." ;; *) echo "Cloud Run service URL metadata is missing run.app" >&2; exit 1 ;; esac']
profiles:
  - name: staging
  - name: production
