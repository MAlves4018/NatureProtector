apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: natureprotector-deploy-verifier
  labels:
    app.kubernetes.io/name: natureprotector-deploy-verifier
    app.kubernetes.io/part-of: natureprotector
spec:
  podSelector:
    matchLabels:
      np.network/deploy-verifier: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
