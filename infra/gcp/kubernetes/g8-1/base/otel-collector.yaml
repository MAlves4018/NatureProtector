apiVersion: v1
kind: ConfigMap
metadata:
  name: natureprotector-otel
  labels: {app.kubernetes.io/name: natureprotector-otel}
data:
  config.yaml: |
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 700}
      batch: {timeout: 5s}
      resource:
        attributes:
          - {key: service.namespace, value: natureprotector, action: upsert}
    exporters:
      googlecloud: {}
    service:
      extensions: [health_check]
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [googlecloud]}
        metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [googlecloud]}
        logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [googlecloud]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: natureprotector-otel
  labels: {app.kubernetes.io/name: natureprotector-otel}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: natureprotector-otel}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: natureprotector-otel
        np.network/otel: "true"
    spec:
      serviceAccountName: natureprotector-otel
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: natureprotector-otel}}
      containers:
        - name: collector
          image: OTEL_IMAGE_BY_DIGEST
          args: ["--config=/conf/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          startupProbe: {httpGet: {path: /, port: health}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: health}, periodSeconds: 20}
      volumes:
        - {name: config, configMap: {name: natureprotector-otel}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: natureprotector-otel
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  loadBalancerIP: 127.0.0.1 # from-param: ${otel_load_balancer_ip}
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: natureprotector-otel}
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}
    - {name: health, port: 13133, targetPort: health}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: natureprotector-otel
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: natureprotector-otel}}
