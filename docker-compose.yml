services:
  influxdb-init:
    image: alpine:3.20.3
    container_name: np-influxdb-init
    command:
      - sh
      - -lc
      - chown -R 1500:1500 /data && chmod -R u+rwX,g+rwX /data
    volumes:
      - influxdb_data:/data
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.0.6-management
    container_name: np-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: np-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  influxdb:
    image: influxdb:3.7.0-core
    container_name: np-influxdb
    command:
      - influxdb3
      - serve
      - --node-id-from-env
      - INFLUXDB_NODE_ID
      - --log-filter
      - info
    environment:
      INFLUXDB_NODE_ID: node1
      INFLUXDB3_ADMIN_TOKEN_FILE: /run/secrets/influx-admin-token.json
    ports:
      - "${INFLUXDB_PORT}:8181"
    volumes:
      - influxdb_data:/home/influxdb3/.influxdb
      - ./data/runtime/influx/admin-token.json:/run/secrets/influx-admin-token.json:ro
    depends_on:
      influxdb-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          token=$$(sed -n
          's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          /run/secrets/influx-admin-token.json | head -n 1) &&
          test -n "$$token" &&
          curl -fsS -H "Authorization: Bearer $$token"
          http://127.0.0.1:8181/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ipma-ingestor:
    build:
      context: .
      dockerfile: infra/ipma/Dockerfile
    container_name: np-ipma-ingestor
    profiles: ["external-data"]
    environment:
      INFLUXDB_URL: http://influxdb:8181
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-np_telemetry}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - ipma_state:/data
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: infra/grafana/Dockerfile
      args:
        INFINITY_PLUGIN_VERSION: 3.6.0
    container_name: np-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_PANELS_DISABLE_SANITIZE_HTML: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_URL: http://influxdb:8181
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
  ipma_state:
